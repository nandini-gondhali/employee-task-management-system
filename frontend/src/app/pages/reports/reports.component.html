<h2 class="mb-4">Reports</h2>

@if (errorMessage) {
  <div class="alert alert-danger">{{ errorMessage }}</div>
}

<ul class="nav nav-tabs mb-3">
  <li class="nav-item">
    <button class="nav-link" [class.active]="activeTab === 'completed'" (click)="setTab('completed')">
      Completed Tasks
    </button>
  </li>
  <li class="nav-item">
    <button class="nav-link" [class.active]="activeTab === 'pending'" (click)="setTab('pending')">
      Pending Tasks
    </button>
  </li>
  <li class="nav-item">
    <button class="nav-link" [class.active]="activeTab === 'employee-wise'" (click)="setTab('employee-wise')">
      Employee-wise Report
    </button>
  </li>
</ul>

<div class="mb-3">
  @if (activeTab !== 'employee-wise') {
    <button class="btn btn-outline-success me-2" (click)="exportCsv()">
      <i class="bi bi-filetype-csv"></i> Export CSV
    </button>
    <button class="btn btn-outline-primary" (click)="exportExcel()">
      <i class="bi bi-file-earmark-excel"></i> Export Excel
    </button>
  }
</div>

<div class="card">
  <div class="card-body">
    @if (loading) {
      <div class="text-center py-4"><div class="spinner-border text-primary"></div></div>
    } @else {
      <div class="table-responsive">
        <table class="table table-striped table-sm">
          <thead>
            <tr>
              @for (col of columns; track col) {
                <th>{{ col }}</th>
              }
            </tr>
          </thead>
          <tbody>
            @for (row of activeData; track $index) {
              <tr>
                @for (col of columns; track col) {
                  <td>{{ row[col] }}</td>
                }
              </tr>
            } @empty {
              <tr><td class="text-center text-muted">No data available.</td></tr>
            }
          </tbody>
        </table>
      </div>
    }
  </div>
</div>
